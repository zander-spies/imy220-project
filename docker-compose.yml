services:
  db:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      MONGO_URI: mongodb://db:27017
      SESSION_SECRET: change-this-secret
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  client:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  mongo_data:
  uploads_data:
